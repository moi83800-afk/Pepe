<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FC 27 Market</title>
<style>
body{background:#101522;color:white;font-family:Arial;padding:18px}
h1{color:#55e6a5}
.card{background:#202b3d;padding:16px;border-radius:14px;margin:12px 0}
input,button{padding:13px;border:0;border-radius:9px;margin:5px 0;box-sizing:border-box}
input{width:100%;background:#edf1f7}
button{background:#55e6a5;font-weight:bold}
.remove{background:#e65b65;color:white;margin-left:8px}
.player{padding:10px;border-bottom:1px solid #445}
small{color:#aab7c9}
#result{font-weight:bold}
</style>
</head>
<body>
<h1>FC 27 MARKET</h1>
<p>Détecteur de bonnes affaires - PS5</p>

<div class="card">
<h3>Rechercher un joueur</h3>
<input id="name" placeholder="Ex : Mbappé, Yamal, Dembélé...">
<button onclick="addPlayer()">Ajouter à ma liste</button>
<p><small>Tu peux ajouter le joueur que tu veux.</small></p>
</div>

<div class="card">
<h3>Mes joueurs surveillés</h3>
<div id="players"></div>
</div>

<div class="card">
<h3>Analyser un prix</h3>
<input id="analyseName" placeholder="Nom du joueur">
<input id="usual" type="number" placeholder="Prix habituel en crédits">
<input id="current" type="number" placeholder="Prix trouvé en crédits">
<button onclick="analyse()">Analyser le prix</button>
<p id="result"></p>
</div>

<script>
let players=JSON.parse(localStorage.getItem("fc27players")||"[]");

function save(){
 localStorage.setItem("fc27players",JSON.stringify(players));
 show();
}

function addPlayer(){
 let name=document.getElementById("name").value.trim();
 if(!name)return alert("Écris le nom du joueur");
 if(players.some(p=>p.toLowerCase()===name.toLowerCase()))
 return alert("Ce joueur est déjà dans ta liste");
 players.push(name);
 document.getElementById("name").value="";
 save();
}

function removePlayer(index){
 players.splice(index,1);
 save();
}

function show(){
 let box=document.getElementById("players");
 if(players.length===0){
 box.innerHTML="<p>Aucun joueur ajouté pour le moment.</p>";
 return;
 }
 box.innerHTML=players.map((p,i)=>
 '<div class="player">⚽ '+escapeHTML(p)+
 ' <button class="remove" onclick="removePlayer('+i+')">Supprimer</button></div>'
 ).join("");
}

function escapeHTML(s){
 return s.replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

function analyse(){
 let n=document.getElementById("analyseName").value.trim();
 let u=Number(document.getElementById("usual").value);
 let c=Number(document.getElementById("current").value);
 let result=document.getElementById("result");
 if(!n||u<=0||c<=0){
 result.textContent="Remplis les trois cases correctement.";
 return;
 }
 let diff=Math.round((u-c)/u*100);
 if(diff>=15){
 result.textContent="🔥 BONNE AFFAIRE ! "+n+" est "+diff+"% moins cher.";
 }else{
 result.textContent="Prix trouvé : "+c.toLocaleString("fr-FR")+
 " crédits. Écart : "+diff+"%.";
 }
}

show();
</script>
</body>
</html>
