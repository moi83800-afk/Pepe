
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FC 27 Market</title>
<style>
body{background:#101522;color:white;font-family:Arial;padding:18px}
h1{color:#55e6a5}
.card{background:#202b3d;padding:16px;border-radius:14px;margin:12px 0}
input,button{padding:13px;border:0;border-radius:9px;margin:5px 0;box-sizing:border-box}
input{width:100%;background:#edf1f7}
button{background:#55e6a5;font-weight:bold;cursor:pointer}
.remove{background:#e65b65;color:white;margin-left:8px}
.player{padding:10px;border-bottom:1px solid #445}
small{color:#aab7c9}
#result{font-weight:bold}
.market-player{padding:12px;border-bottom:1px solid #445}
.price{color:#55e6a5;font-weight:bold}
.muted{color:#aab7c9}
#status{font-size:13px;color:#aab7c9}
</style>
</head>
<body>

<h1>FC 27 MARKET</h1>
<p>Détecteur de bonnes affaires - PS5</p>

<div class="card">
<h3>Marché FC 27</h3>
<p id="status">Connexion au marché en cours...</p>
<button onclick="loadMarket()">Actualiser les prix</button>
</div>

<div class="card">
<h3>Rechercher un joueur</h3>
<input id="name" placeholder="Ex : Mbappé, Yamal, Dembélé...">
<button onclick="searchMarket()">Chercher sur le marché</button>
<div id="searchResults"></div>
<p><small>La recherche utilise les joueurs présents dans les données de l'API.</small></p>
</div>

<div class="card">
<h3>Mes joueurs surveillés</h3>
<div id="players"></div>
</div>

<div class="card">
<h3>Analyser un prix</h3>
<input id="analyseName" placeholder="Nom du joueur">
<input id="usual" type="number" placeholder="Prix habituel en crédits">
<input id="current" type="number" placeholder="Prix trouvé en crédits">
<button onclick="analyse()">Analyser le prix</button>
<p id="result"></p>
</div>

<script>
const API_URL = "https://fc27-market.val.run/latest";

let players = JSON.parse(localStorage.getItem("fc27players") || "[]");
let marketPlayers = [];
let marketUpdated = null;

function formatPrice(price) {
  if (price === null || price === undefined || price === 0) {
    return "Prix indisponible";
  }
  return Number(price).toLocaleString("fr-FR") + " crédits";
}

function normalize(text) {
  return String(text || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}

async function loadMarket() {
  const status = document.getElementById("status");
  status.textContent = "Chargement des données du marché...";

  try {
    const response = await fetch(API_URL);

    if (!response.ok) {
      throw new Error("Erreur HTTP " + response.status);
    }

    const data = await response.json();

    marketPlayers = [];
    marketUpdated = data.updated || null;

    if (data.groups) {
      Object.values(data.groups).forEach(group => {
        if (Array.isArray(group)) {
          marketPlayers.push(...group);
        }
      });
    }

    status.textContent =
      marketPlayers.length + " joueurs chargés. " +
      (marketUpdated
        ? "Dernière mise à jour : " +
          new Date(marketUpdated).toLocaleString("fr-FR")
        : "");

    show();
  } catch (error) {
    console.error(error);
    status.textContent =
      "Impossible de charger le marché. Vérifie ta connexion ou réessaie plus tard.";
  }
}

function findPlayer(name) {
  const query = normalize(name);
  if (!query) return null;

  return marketPlayers.find(p => normalize(p.name) === query)
    || marketPlayers.find(p => normalize(p.name).includes(query))
    || null;
}

function searchMarket() {
  const name = document.getElementById("name").value.trim();
  const results = document.getElementById("searchResults");

  results.innerHTML = "";

  if (!name) {
    results.textContent = "Écris le nom d'un joueur.";
    return;
  }

  const query = normalize(name);

  const matches = marketPlayers
    .filter(p => normalize(p.name).includes(query))
    .slice(0, 10);

  if (matches.length === 0) {
    results.textContent =
      "Aucun joueur trouvé dans les données de l'API.";
    return;
  }

  matches.forEach(player => {
    const div = document.createElement("div");
    div.className = "market-player";

    const info = document.createElement("div");
    info.innerHTML =
      "<strong>" + escapeHTML(player.name) + "</strong> " +
      " | Note : " + escapeHTML(player.rating) +
      "<br><span class='price'>" +
      escapeHTML(formatPrice(player.price)) +
      "</span>";

    const button = document.createElement("button");
    button.textContent = "Ajouter à ma liste";
    button.onclick = () => {
      addPlayer(player.name);
    };

    div.appendChild(info);
    div.appendChild(button);
    results.appendChild(div);
  });
}

function save() {
  localStorage.setItem("fc27players", JSON.stringify(players));
  show();
}

function addPlayer(nameFromMarket) {
  const name = nameFromMarket ||
    document.getElementById("name").value.trim();

  if (!name) {
    alert("Écris le nom du joueur");
    return;
  }

  if (players.some(p => normalize(p) === normalize(name))) {
    alert("Ce joueur est déjà dans ta liste");
    return;
  }

  players.push(name);
  document.getElementById("name").value = "";
  document.getElementById("searchResults").innerHTML = "";
  save();
}

function removePlayer(index) {
  players.splice(index, 1);
  save();
}

function show() {
  const box = document.getElementById("players");

  if (players.length === 0) {
    box.innerHTML = "<p>Aucun joueur ajouté pour le moment.</p>";
    return;
  }

  box.innerHTML = "";

  players.forEach((name, index) => {
    const div = document.createElement("div");
    div.className = "player";

    const marketPlayer = findPlayer(name);

    const info = document.createElement("div");
    info.innerHTML = "⚽ <strong>" + escapeHTML(name) + "</strong>";

    if (marketPlayer) {
      info.innerHTML +=
        "<br><span class='price'>" +
        escapeHTML(formatPrice(marketPlayer.price)) +
        "</span>" +
        "<br><small>Note : " +
        escapeHTML(marketPlayer.rating) +
        (marketPlayer.pct_7d !== undefined
          ? " | Évolution 7 jours : " +
            escapeHTML(marketPlayer.pct_7d) + "%"
          : "") +
        "</small>";
    } else {
      info.innerHTML +=
        "<br><small>Joueur non présent dans les données de l'API.</small>";
    }

    const button = document.createElement("button");
    button.className = "remove";
    button.textContent = "Supprimer";
    button.onclick = () => removePlayer(index);

    div.appendChild(info);
    div.appendChild(button);
    box.appendChild(div);
  });
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

function analyse() {
  const n = document.getElementById("analyseName").value.trim();
  const u = Number(document.getElementById("usual").value);
  const c = Number(document.getElementById("current").value);
  const result = document.getElementById("result");

  if (!n || u <= 0 || c <= 0) {
    result.textContent = "Remplis les trois cases correctement.";
    return;
  }

  const diff = Math.round((u - c) / u * 100);

  if (diff >= 15) {
    result.textContent =
      "🔥 BONNE AFFAIRE ! " + n + " est " + diff + "% moins cher.";
  } else {
    result.textContent =
      "Prix trouvé : " + c.toLocaleString("fr-FR") +
      " crédits. Écart : " + diff + "%.";
  }
}

show();
loadMarket();
</script>

</body>
</html>
